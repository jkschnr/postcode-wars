<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>City map v2 — Postcode Wars</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../ui.css">
<script src="npcs.js"></script>
<script>window.NPC_ART_BASE = 'art/';</script>
<script src="../chrome.js"></script>
<style>
  html, body { margin:0; background:#07080A; }
  #leaf { position:absolute; inset:0; z-index:0; isolation:isolate; background:#07080A; }
  /* street level: keep more road detail than the UK map, push it amber */
  .leaflet-tile-pane { filter:grayscale(1) brightness(0.40) contrast(1.62) sepia(0.30) hue-rotate(-14deg) saturate(1.6); }
  .leaflet-container { background:#07080A; font-family:'IBM Plex Mono', monospace; }
  .leaflet-control-attribution { background:rgba(7,8,10,0.7) !important; color:#4A5058 !important; font-size:11px !important; }
  .leaflet-control-attribution a { color:#8A9299 !important; }
  .disp { font-family:Anton, Impact, sans-serif; text-transform:uppercase; }
  .mono { font-family:'IBM Plex Mono', monospace; }
  .tab  { font-variant-numeric:tabular-nums; }
  .pin { position:absolute; transform:translate(-50%,-100%); cursor:pointer; }
  .zonelabel { position:absolute; transform:translate(-50%,-50%); pointer-events:none; }
  @keyframes flow { to { stroke-dashoffset:-180; } }
  @keyframes breathe { 0%,100% { opacity:0.5; } 50% { opacity:1; } }
  @keyframes ping { 0% { transform:scale(0.7); opacity:0.9; } 100% { transform:scale(2.2); opacity:0; } }
  @keyframes sheetUp { from { transform:translateY(112%); } to { transform:none; } }
  @keyframes patrol { to { stroke-dashoffset:-400; } }
</style>
</head>
<body>
<div id="frame">

  <div id="leaf"></div>

  <!-- postcode blocks, tinted by who holds them -->
  <canvas id="zones" width="1080" height="1920"
    style="position:absolute; inset:0; z-index:6; pointer-events:none; mix-blend-mode:screen;"></canvas>

  <!-- patrol route + supply run -->
  <svg id="paths" viewBox="0 0 1080 1920" style="position:absolute; inset:0; z-index:8; pointer-events:none;"></svg>

  <div style="position:absolute; inset:0; pointer-events:none; z-index:14; background:
      radial-gradient(46% 26% at 26% 34%, rgba(255,201,122,0.16), rgba(255,201,122,0) 66%),
      radial-gradient(40% 22% at 78% 62%, rgba(176,108,240,0.12), rgba(176,108,240,0) 68%),
      linear-gradient(180deg, rgba(7,8,10,0.97) 0%, rgba(7,8,10,0.34) 15%, rgba(7,8,10,0) 30%,
        rgba(7,8,10,0) 50%, rgba(7,8,10,0.66) 76%, rgba(7,8,10,0.98) 100%);"></div>

  <div id="overlay" style="position:absolute; inset:0; z-index:16;"></div>

  <div id="hud"></div>

  <!-- city header -->
  <div style="position:absolute; left:32px; top:168px; z-index:20; display:flex; flex-direction:column; gap:8px;">
    <div style="display:flex; align-items:center; gap:14px;">
      <a href="main-map.html" class="mono" style="border:1px solid #2A2E33; border-radius:8px; background:rgba(14,16,19,0.8);
        padding:12px 16px; font-size:19px; letter-spacing:0.14em; color:#9AA0A6; text-decoration:none;">← UK</a>
      <span class="mono" style="font-size:20px; letter-spacing:0.2em; color:#FFA94D;">LONDON · E8 · HACKNEY</span>
    </div>
    <span class="disp" style="font-size:96px; line-height:0.84; text-shadow:0 4px 30px rgba(0,0,0,0.95);">Your<br>postcode</span>
    <div style="display:flex; gap:10px; align-items:center; padding-top:6px;" id="cityStats"></div>
  </div>

  <!-- zone strip: the eight blocks, colour-coded, tappable -->
  <div style="position:absolute; left:0; right:0; bottom:800px; z-index:20; padding:0 32px;">
    <div class="mono" style="font-size:19px; letter-spacing:0.2em; color:#5A6068; padding-bottom:10px;">BLOCKS · TAP TO FOCUS</div>
    <div style="display:flex; gap:10px; overflow:hidden;" id="zoneChips"></div>
  </div>

  <div id="sheet" style="position:absolute; left:24px; right:24px; bottom:180px; z-index:22;"></div>

  <div id="nav"></div>
  <div class="tooth"></div>
  <div class="grain"></div>
</div>

<script>
const W = 1080, H = 1920;

/* Eight real Hackney blocks. hold = who runs the block; venues sit inside them. */
const ZONES = [
  { id:'london_fields', name:'London Fields', hold:'manor', heat:1, take:'£1.2k',
    poly:[[51.5430,-0.0620],[51.5455,-0.0525],[51.5405,-0.0470],[51.5380,-0.0565]] },
  { id:'broadway',      name:'Broadway Market', hold:'manor', heat:2, take:'£980',
    poly:[[51.5380,-0.0565],[51.5405,-0.0470],[51.5350,-0.0430],[51.5325,-0.0520]] },
  { id:'dalston',       name:'Dalston Lane', hold:'vale', heat:4, take:'£2.4k',
    poly:[[51.5480,-0.0760],[51.5510,-0.0640],[51.5455,-0.0600],[51.5430,-0.0720]] },
  { id:'kingsland',     name:'Kingsland Road', hold:'trade', heat:3, take:'£1.6k',
    poly:[[51.5430,-0.0770],[51.5455,-0.0700],[51.5360,-0.0660],[51.5340,-0.0740]] },
  { id:'well_street',   name:'Well Street', hold:'manor', heat:1, take:'£640',
    poly:[[51.5395,-0.0455],[51.5420,-0.0360],[51.5370,-0.0320],[51.5345,-0.0410]] },
  { id:'homerton',      name:'Homerton', hold:'vale', heat:3, take:'£1.1k',
    poly:[[51.5480,-0.0470],[51.5510,-0.0350],[51.5450,-0.0310],[51.5425,-0.0430]] },
  { id:'arches',        name:'The Arches', hold:'rhodes', heat:2, take:'£3.1k',
    poly:[[51.5350,-0.0660],[51.5375,-0.0590],[51.5320,-0.0555],[51.5300,-0.0625]] },
  { id:'marshes',       name:'The Marshes', hold:'none', heat:0, take:'£0',
    poly:[[51.5530,-0.0430],[51.5570,-0.0280],[51.5500,-0.0250],[51.5470,-0.0390]] }
];

/* Venues sit on real coordinates and carry their fascia art. */
const VENUES = [
  { id:'barber',  name:'Uncle T · Barber',  sign:'barber',  lat:51.5412, lon:-0.0555, zone:'broadway',
    kind:'STORY',    jobs:2, note:'Back room. Nobody knocks.' },
  { id:'chicken', name:'ChickenLix',        sign:'chicken', lat:51.5445, lon:-0.0592, zone:'london_fields',
    kind:'GRAFT',    jobs:3, note:'Open till three. Mopeds idling out front.' },
  { id:'tyres',   name:'Maz Tyres',         sign:'tyres',   lat:51.5468, lon:-0.0668, zone:'dalston',
    kind:'WHEELS',   jobs:2, note:'Part worn, no questions, cash only.' },
  { id:'betting', name:'Betfrenz',          sign:'betting', lat:51.5392, lon:-0.0712, zone:'kingsland',
    kind:'HUSTLE',   jobs:2, note:'Till codes change on a Tuesday.' },
  { id:'laundry', name:'Bubbles',           sign:'laundry', lat:51.5372, lon:-0.0402, zone:'well_street',
    kind:'WASH',     jobs:1, note:'Service wash. Fifteen per cent.' },
  { id:'gym',     name:'Ironworks',         sign:'gym',     lat:51.5462, lon:-0.0398, zone:'homerton',
    kind:'TRAIN',    jobs:1, note:'Twenty-four hour. Nobody there at four.' },
  { id:'lockups', name:'Arch 14',           sign:'lockups', lat:51.5334, lon:-0.0612, zone:'arches',
    kind:'STORAGE',  jobs:3, note:'Rhodes holds the lease. You hold a key.' },
  { id:'corner',  name:'Pearl & Sons',      sign:'corner',  lat:51.5352, lon:-0.0498, zone:'broadway',
    kind:'CONTACT',  jobs:1, note:'Off licence. Aunty Pearl sees everything.' }
];

/* A patrol loop and a supply run, drawn as animated paths. */
const PATROL = [[51.5510,-0.0700],[51.5470,-0.0560],[51.5400,-0.0490],[51.5340,-0.0600],[51.5400,-0.0740],[51.5510,-0.0700]];
const SUPPLY = [[51.5334,-0.0612],[51.5392,-0.0712],[51.5468,-0.0668]];

const KIND_COL = { STORY:'#FFA94D', GRAFT:'#D9E021', WHEELS:'#4DA3FF', HUSTLE:'#B06CF0',
  WASH:'#57C785', TRAIN:'#F2C14E', STORAGE:'#C9A227', CONTACT:'#6FCF6F' };
const zoneById = Object.fromEntries(ZONES.map(z => [z.id, z]));
const holdCol = h => h === 'none' ? '#5A6068' : (FACTION[h] || FACTION.trade).ring;

function scaleFrame() {
  const f = document.getElementById('frame');
  const s = Math.min(1, innerHeight / H, innerWidth / W);
  f.style.transform = 'scale(' + s + ')';
  document.body.style.height = (H * s) + 'px';
}
addEventListener('resize', scaleFrame);
scaleFrame();
mountChrome('city', {});

const map = L.map('leaf', {
  dragging:false, touchZoom:false, scrollWheelZoom:false, doubleClickZoom:false,
  boxZoom:false, keyboard:false, zoomControl:false, zoomSnap:0.05
});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap contributors', maxZoom:19
}).addTo(map);
map.fitBounds([[51.5290, -0.0790], [51.5575, -0.0240]], { paddingTopLeft:[0, 320], paddingBottomRight:[0, 640] });

const overlay = document.getElementById('overlay');
const zctx = document.getElementById('zones').getContext('2d');
const paths = document.getElementById('paths');
let focus = null, selected = 'barber';

/* ---- 1 · postcode blocks as coloured fields over the real streets ---- */
function paintZones() {
  zctx.clearRect(0, 0, W, H);
  ZONES.forEach(z => {
    const pts = z.poly.map(([la, lo]) => map.latLngToContainerPoint([la, lo]));
    const col = holdCol(z.hold);
    const dim = focus && focus !== z.id;
    zctx.save();
    zctx.beginPath();
    pts.forEach((p, i) => i ? zctx.lineTo(p.x, p.y) : zctx.moveTo(p.x, p.y));
    zctx.closePath();

    const cx = pts.reduce((a, p) => a + p.x, 0) / pts.length;
    const cy = pts.reduce((a, p) => a + p.y, 0) / pts.length;
    const r = Math.max(...pts.map(p => Math.hypot(p.x - cx, p.y - cy)));
    const g = zctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.1);
    const a = (z.hold === 'none' ? 0.12 : 0.46) * (dim ? 0.3 : 1) * (focus === z.id ? 1.4 : 1);
    g.addColorStop(0, col + Math.round(Math.min(1, a) * 255).toString(16).padStart(2, '0'));
    g.addColorStop(1, col + '0a');
    zctx.fillStyle = g;
    zctx.fill();

    zctx.strokeStyle = col + (dim ? '33' : focus === z.id ? 'ff' : '99');
    zctx.lineWidth = focus === z.id ? 4 : 2;
    zctx.setLineDash(z.hold === 'none' ? [10, 10] : []);
    zctx.stroke();

    /* heat reads as a red core inside the block */
    if (z.heat >= 3) {
      const hg = zctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      hg.addColorStop(0, 'rgba(214,59,59,' + (0.10 + z.heat * 0.045) * (dim ? 0.3 : 1) + ')');
      hg.addColorStop(1, 'rgba(214,59,59,0)');
      zctx.fillStyle = hg;
      zctx.fill();
    }
    zctx.restore();
  });
}

/* ---- 2 · patrol loop + supply run ---- */
function paintPaths() {
  const toP = ll => map.latLngToContainerPoint(ll);
  const d = arr => arr.map((ll, i) => (i ? 'L' : 'M') + toP(ll).x + ',' + toP(ll).y).join(' ');
  paths.innerHTML = `
    <path d="${d(PATROL)}" fill="none" stroke="#2E5EAA" stroke-width="4" stroke-linecap="round"
      opacity="0.55" stroke-dasharray="22 26" style="animation:patrol 5200ms linear infinite;"></path>
    <path d="${d(SUPPLY)}" fill="none" stroke="#B06CF0" stroke-width="3" stroke-linecap="round"
      opacity="0.6" stroke-dasharray="14 20" style="animation:flow 3000ms linear infinite;"></path>`;
}

/* ---- 3 · venue pins ---- */
const pinEls = {}, zoneLabelEls = {};
VENUES.forEach(v => {
  const el = document.createElement('div');
  el.className = 'pin';
  el.addEventListener('click', () => selectVenue(v.id));
  overlay.appendChild(el);
  pinEls[v.id] = el;
});
ZONES.forEach(z => {
  const el = document.createElement('div');
  el.className = 'zonelabel';
  overlay.appendChild(el);
  zoneLabelEls[z.id] = el;
});

function pinHTML(v) {
  const col = KIND_COL[v.kind];
  const on = selected === v.id;
  const dim = focus && focus !== v.zone;
  return `<div style="display:flex; flex-direction:column; align-items:center; gap:6px; opacity:${dim ? 0.32 : 1};">
    <div style="border:1px solid ${on ? col : '#2A2E33'}; border-radius:9px;
      background:rgba(10,12,14,0.9); padding:7px 11px; display:flex; align-items:center; gap:8px;
      box-shadow:${on ? '0 0 26px ' + col + '66' : 'none'};">
      <span style="width:10px; height:10px; border-radius:3px; background:${col};"></span>
      <span class="mono" style="font-size:${on ? 20 : 18}px; letter-spacing:0.1em; color:${on ? '#EDEFF2' : '#B9C0C7'};">${v.name.toUpperCase()}</span>
      ${v.jobs ? `<span class="mono tab" style="font-size:17px; color:${col};">${v.jobs}</span>` : ''}
    </div>
    <div style="position:relative; width:${on ? 26 : 18}px; height:${on ? 26 : 18}px;">
      ${on ? `<span style="position:absolute; inset:0; border-radius:50%; border:2px solid ${col};
        animation:ping 2000ms ease-out infinite;"></span>` : ''}
      <span style="position:absolute; inset:0; border-radius:50%; background:${col};
        box-shadow:0 0 ${on ? 22 : 10}px ${col};"></span>
    </div>
  </div>`;
}

function place() {
  paintZones();
  paintPaths();
  VENUES.forEach(v => {
    const p = map.latLngToContainerPoint([v.lat, v.lon]);
    const el = pinEls[v.id];
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    el.innerHTML = pinHTML(v);
  });
  ZONES.forEach(z => {
    const pts = z.poly.map(([la, lo]) => map.latLngToContainerPoint([la, lo]));
    const cx = pts.reduce((a, p) => a + p.x, 0) / pts.length;
    const cy = pts.reduce((a, p) => a + p.y, 0) / pts.length;
    const col = holdCol(z.hold);
    const dim = focus && focus !== z.id;
    zoneLabelEls[z.id].style.left = cx + 'px';
    zoneLabelEls[z.id].style.top = cy + 'px';
    zoneLabelEls[z.id].innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; gap:3px; opacity:${dim ? 0.3 : 1};">
        <span class="disp" style="font-size:26px; line-height:1; color:${col};
          text-shadow:0 2px 14px rgba(0,0,0,0.98);">${z.name}</span>
        <span class="mono tab" style="font-size:16px; letter-spacing:0.12em; color:#8A9299;
          text-shadow:0 2px 10px rgba(0,0,0,0.98);">${z.hold === 'none' ? 'UNCLAIMED' : z.take + ' · HEAT ' + z.heat}</span>
      </div>`;
  });
}

/* ---- 4 · chips, header stats, venue sheet ---- */
document.getElementById('cityStats').innerHTML = [
  ['BLOCKS HELD', '5 / 8', '#FFA94D'],
  ['DAILY TAKE', '£9.6k', '#C9A227'],
  ['HEAT', '3 / 5', '#D63B3B']
].map(([k, v, c]) => `
  <div style="border:1px solid #2A2E33; border-radius:10px; background:rgba(14,16,19,0.8); padding:10px 14px;
    display:flex; flex-direction:column; gap:2px;">
    <span class="mono" style="font-size:16px; letter-spacing:0.14em; color:#5A6068;">${k}</span>
    <span class="disp tab" style="font-size:28px; color:${c};">${v}</span>
  </div>`).join('');

function paintChips() {
  document.getElementById('zoneChips').innerHTML = ZONES.map(z => {
    const col = holdCol(z.hold);
    const on = focus === z.id;
    return `<button data-zone="${z.id}" style="flex:1; min-width:0; border:1px solid ${on ? col : '#2A2E33'};
      border-radius:10px; background:${on ? col + '1f' : 'rgba(14,16,19,0.82)'}; padding:12px 8px; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; gap:6px;">
      <span style="width:100%; height:5px; border-radius:3px; background:${col}; opacity:${on ? 1 : 0.6};"></span>
      <span class="mono" style="font-size:16px; letter-spacing:0.06em; color:${on ? '#EDEFF2' : '#8A9299'};
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;">${z.name.split(' ')[0].toUpperCase()}</span>
    </button>`;
  }).join('');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-zone]');
  if (!b) return;
  focus = focus === b.dataset.zone ? null : b.dataset.zone;
  paintChips();
  place();
});

function selectVenue(id) {
  selected = id;
  const v = VENUES.find(x => x.id === id);
  const z = zoneById[v.zone];
  const col = KIND_COL[v.kind];
  const who = (typeof NPCS !== 'undefined' ? NPCS.filter(n => n.city === 'London') : []).slice(0, 4);
  document.getElementById('sheet').innerHTML = `
    <div style="border:1px solid ${col}44; border-radius:18px; overflow:hidden;
      background:linear-gradient(180deg, rgba(30,33,38,0.97), rgba(14,16,19,0.97));
      animation:sheetUp 260ms cubic-bezier(.2,.8,.3,1) both; box-shadow:0 -20px 60px rgba(0,0,0,0.6);">
      <div style="height:120px; background-image:url(art/sign-${v.sign}.png); background-size:cover;
        background-position:center 30%; border-bottom:1px solid ${col}44;"></div>
      <div style="padding:20px 26px 24px; display:flex; flex-direction:column; gap:14px;">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:18px;">
          <div style="display:flex; flex-direction:column; gap:4px;">
            <span class="mono" style="font-size:19px; letter-spacing:0.18em; color:${col};">${v.kind} · ${z.name.toUpperCase()}</span>
            <span class="disp" style="font-size:50px; line-height:0.92;">${v.name}</span>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
            <span class="mono" style="font-size:17px; letter-spacing:0.14em; color:#5A6068;">JOBS</span>
            <span class="disp tab" style="font-size:42px; color:${col};">${v.jobs}</span>
          </div>
        </div>
        <span style="font-size:24px; line-height:1.4; color:#9AA0A6;">${v.note}</span>
        <div style="display:flex; align-items:center; gap:12px; border-top:1px solid #2A2E33; padding-top:14px;">
          <span class="mono" style="font-size:17px; letter-spacing:0.14em; color:#5A6068;">INSIDE</span>
          <div style="display:flex; gap:8px;">${who.map(n => npcSlot(n, 54)).join('')}</div>
          <span class="mono" style="font-size:17px; color:#8A9299;">${who.map(n => n.name.split(' ')[0]).join(' · ')}</span>
        </div>
        <div style="display:flex; gap:12px;">
          <button class="btn" style="flex:1; background:#D9E021; color:#121417;">Go in</button>
          <button class="btn btn-secondary" style="width:200px;">Case it</button>
        </div>
      </div>
    </div>`;
  place();
}

map.on('move zoom moveend zoomend', place);
map.whenReady(() => { paintChips(); place(); selectVenue('barber'); setTimeout(place, 400); });
setTimeout(place, 1200);
</script>
</body>
</html>
