<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>19-trapline — Postcode Wars</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<script src="chrome.js"></script>
<script src="anim.js"></script>
</head>
<body>
<div id="frame">
  <div style="position:absolute; inset:0; background:
      radial-gradient(50% 30% at 74% 16%, rgba(255,169,77,0.16), rgba(255,169,77,0) 70%),
      linear-gradient(180deg, #15181C 0%, #121417 50%, #0E1013 100%);"></div>
  <div id="hud"></div>

  <div style="position:absolute; left:32px; right:32px; top:180px; z-index:35; display:flex; align-items:flex-end; justify-content:space-between; gap:24px;">
    <div style="display:flex; flex-direction:column; gap:8px;">
      <span class="mono" style="font-size:22px; letter-spacing:0.18em; color:#FFA94D;">SUPPLY NETWORK · LONDON HUB</span>
      <span class="disp" style="font-size:80px; line-height:0.9;">Trapline</span>
    </div>
    <div class="tab" style="display:flex; gap:12px;">
      <span class="chipm" style="color:#57C785;">£4,180/DAY</span>
      <span class="chipm" style="color:#D63B3B;">1 LINE SICK</span>
    </div>
  </div>

  <!-- transit diagram -->
  <svg id="diagram" width="1016" height="880" viewBox="0 0 1016 880" style="position:absolute; left:32px; top:360px; z-index:35;"></svg>

  <!-- legend + detail -->
  <div style="position:absolute; left:32px; right:32px; bottom:196px; z-index:40; display:flex; flex-direction:column; gap:16px;">
    <div class="sechead">
      <span class="mono" style="font-size:20px; letter-spacing:0.2em; color:#FFA94D;">LINE HEALTH</span>
      <span class="rule"></span>
      <span class="mono" style="font-size:20px; color:#5A6068;">TAP A STOP</span>
    </div>
    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;">
      <div class="panel" style="padding:18px 20px; display:flex; align-items:center; gap:14px;">
        <span style="width:18px; height:18px; border-radius:9px; background:#57C785;"></span>
        <span class="mono" style="font-size:20px; color:#9AA0A6;">RUNNING CLEAN</span>
      </div>
      <div class="panel" style="padding:18px 20px; display:flex; align-items:center; gap:14px;">
        <span style="width:18px; height:18px; border-radius:9px; background:#C9A227;"></span>
        <span class="mono" style="font-size:20px; color:#9AA0A6;">SLOW · NEEDS A VISIT</span>
      </div>
      <div class="panel" style="padding:18px 20px; display:flex; align-items:center; gap:14px;">
        <span style="width:18px; height:18px; border-radius:9px; background:#D63B3B;"></span>
        <span class="mono" style="font-size:20px; color:#9AA0A6;">HEAT · SHUT IT DOWN</span>
      </div>
    </div>
    <div id="detail" class="panel" style="padding:22px 26px; display:flex; align-items:center; gap:22px;"></div>
    <div class="tab" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;">
      <div class="panel" style="padding:18px 22px; display:flex; flex-direction:column; gap:6px;">
        <span class="mono" style="font-size:20px; letter-spacing:0.12em; color:#5A6068;">STOPS HELD</span>
        <span class="disp" style="font-size:38px;">8</span>
      </div>
      <div class="panel" style="padding:18px 22px; display:flex; flex-direction:column; gap:6px;">
        <span class="mono" style="font-size:20px; letter-spacing:0.12em; color:#5A6068;">WEEKLY TAKE</span>
        <span class="disp" style="font-size:38px; color:#C9A227;">£29.3k</span>
      </div>
      <div class="panel" style="padding:18px 22px; display:flex; flex-direction:column; gap:6px;">
        <span class="mono" style="font-size:20px; letter-spacing:0.12em; color:#5A6068;">NEED A VISIT</span>
        <span class="disp" style="font-size:38px; color:#D63B3B;">3</span>
      </div>
    </div>
  </div>

  <div id="nav"></div>
  <div class="tooth"></div>
  <div class="grain"></div>
</div>

<script>
mountChrome('firm', {});

const HEALTH = { good:'#57C785', slow:'#C9A227', hot:'#D63B3B' };
// schematic, not geography: three lines out of the London hub
const LINES = [
  { name:'NORTH LINE', tint:'#FFA94D', stops:[
    { id:'hub', label:'LONDON', x:180, y:120, health:'good', take:'£2,400/day', note:'Hub. Everything moves through Hackney first.' },
    { label:'LUTON', x:430, y:120, health:'good', take:'£640/day', note:'Two runners, both quiet. Nothing to fix.' },
    { label:'NORTHAMPTON', x:680, y:120, health:'slow', take:'£210/day', note:'Runner missed two drops. Go and be seen.' },
    { label:'GRIMSBY', x:900, y:250, health:'good', take:'£380/day', note:'Small, steady, forgotten by everyone. Ideal.' }
  ] },
  { name:'WEST LINE', tint:'#4DA3FF', stops:[
    { label:'SWINDON', x:430, y:400, health:'good', take:'£300/day', note:'Motorway town. Easy in, easy out.' },
    { label:'BRISTOL', x:680, y:400, health:'hot', take:'£0/day', note:'Two lifted last week. Shut it or lose the lot.' }
  ] },
  { name:'SOUTH LINE', tint:'#B06CF0', stops:[
    { label:'MARGATE', x:430, y:660, health:'good', take:'£250/day', note:'Seasonal. Doubles in July, dies in November.' },
    { label:'DOVER', x:680, y:660, health:'slow', take:'£120/day', note:'Port checks up. Send someone with a proper van.' }
  ] }
];

const hub = LINES[0].stops[0];
let svg = '';
LINES.forEach(line => {
  const pts = line.stops[0].id === 'hub' ? line.stops : [hub, ...line.stops];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const midX = b.x;
    svg += `<path d="M${a.x},${a.y} L${midX - 60},${a.y} Q${midX},${a.y} ${midX},${a.y + Math.sign(b.y - a.y) * 60} L${b.x},${b.y}"
      fill="none" stroke="${line.tint}" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>`;
  }
});
LINES.forEach((line, li) => {
  const ly = line.stops[0].id === 'hub' ? 44 : line.stops[0].y - 54;
  svg += `<text x="20" y="${ly}"
    fill="${line.tint}" font-family="IBM Plex Mono, monospace" font-size="22" letter-spacing="3" opacity="0.85">${line.name}</text>`;
  line.stops.forEach((s, i) => {
    const isHub = s.id === 'hub';
    svg += `<g class="stop" data-line="${li}" data-i="${i}" style="cursor:pointer;">
      <circle cx="${s.x}" cy="${s.y}" r="${isHub ? 34 : 22}" fill="#121417" stroke="${HEALTH[s.health]}" stroke-width="${isHub ? 8 : 6}"/>
      ${isHub ? `<circle cx="${s.x}" cy="${s.y}" r="12" fill="#FFA94D"/>` : ''}
      <text x="${s.x}" y="${s.y + (isHub ? 74 : 58)}" text-anchor="middle" fill="#EDEFF2"
        font-family="Anton, sans-serif" font-size="${isHub ? 40 : 30}">${s.label}</text>
      <text x="${s.x}" y="${s.y + (isHub ? 104 : 84)}" text-anchor="middle" fill="${HEALTH[s.health]}"
        font-family="IBM Plex Mono, monospace" font-size="20">${s.take}</text>
    </g>`;
  });
});
document.getElementById('diagram').innerHTML = svg;

function detail(s, line) {
  document.getElementById('detail').innerHTML = `
    <span style="width:22px; height:22px; border-radius:11px; flex:none; background:${HEALTH[s.health]};"></span>
    <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:8px;">
      <span class="mono" style="font-size:20px; letter-spacing:0.14em; color:${line.tint};">${line.name} · ${s.take.toUpperCase()}</span>
      <span class="disp" style="font-size:40px; line-height:1;">${s.label}</span>
      <span style="font-size:26px; line-height:1.35; color:#9AA0A6;">${s.note}</span>
    </div>
    <button class="btn ${s.health === 'hot' ? 'btn-danger' : 'btn-secondary'}" style="padding:0 28px; font-size:28px;">${s.health === 'hot' ? 'Shut it down' : 'Go and be seen'}</button>`;
}
document.querySelectorAll('.stop').forEach(g => g.addEventListener('click', () => {
  const line = LINES[+g.dataset.line];
  detail(line.stops[+g.dataset.i], line);
}));
detail(LINES[1].stops[1], LINES[1]);
</script>
</body>
</html>
