<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>14-jail — Postcode Wars</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link rel="stylesheet" href="ui.css">
<script src="cast.js"></script>
<script src="chrome.js"></script>
<script src="anim.js"></script>
<script src="atmos.js"></script>
<style>
  /* oppressive grey: no sodium, strip light instead */
  #frame { background:#15171A; }
  .cell { background:
      linear-gradient(180deg, rgba(237,239,242,0.05) 0%, rgba(237,239,242,0) 22%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.32) 0 8px, rgba(0,0,0,0) 8px 96px),
      #15171A; }
</style>
</head>
<body>
<div id="frame">
  <div class="cell" style="position:absolute; inset:0; z-index:1; background:
      linear-gradient(180deg, rgba(237,239,242,0.05) 0%, rgba(237,239,242,0) 22%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.55) 0 10px, rgba(0,0,0,0) 10px 96px),
      linear-gradient(180deg, rgba(21,23,26,0.82) 0%, rgba(21,23,26,0.92) 60%, rgba(12,14,16,0.96) 100%);"></div>
  <div class="disp" style="position:absolute; right:-20px; top:1080px; z-index:2; font-size:300px; line-height:0.8; color:#EDEFF2; opacity:0.05; pointer-events:none;">HELD</div>

  <div id="hud"></div>

  <div style="position:absolute; left:32px; right:32px; top:180px; z-index:35; display:flex; flex-direction:column; gap:10px;">
    <span class="mono" style="font-size:22px; letter-spacing:0.2em; color:#9AA0A6;">HELD AT WOOD GREEN · CUSTODY 4471</span>
    <span class="disp" style="font-size:88px; line-height:0.9; color:#C3C9CF;">Nicked</span>
  </div>

  <!-- timer dominates -->
  <div style="position:absolute; left:32px; right:32px; top:420px; z-index:35; display:flex; flex-direction:column; align-items:center; gap:22px;">
    <div style="width:520px; height:520px; border-radius:50%; background:conic-gradient(#9AA0A6 0% 21%, #23262A 21% 100%); display:flex; align-items:center; justify-content:center;">
      <div style="width:456px; height:456px; border-radius:50%; background:#15171A; border:1px solid #2A2E33; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;">
        <span class="mono" style="font-size:22px; letter-spacing:0.2em; color:#5A6068;">OUT IN</span>
        <span id="clock" class="disp tab" style="font-size:120px; line-height:0.9; color:#EDEFF2;">11:02:39</span>
        <span class="mono tab" style="font-size:22px; color:#9AA0A6;">21% SERVED</span>
      </div>
    </div>
    <span class="mono" style="font-size:22px; letter-spacing:0.14em; color:#5A6068;">NOTHING RUNS WHILE YOU'RE IN HERE</span>
  </div>

  <!-- consequences -->
  <div class="tab" style="position:absolute; left:32px; right:32px; top:1030px; z-index:35; display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;">
    <div class="panel" style="background:#1B1E22; padding:20px 22px; display:flex; flex-direction:column; gap:6px;">
      <span class="mono" style="font-size:20px; letter-spacing:0.12em; color:#5A6068;">DIRTY SEIZED</span>
      <span class="disp" style="font-size:40px; color:#D63B3B;">−£4,100</span>
    </div>
    <div class="panel" style="background:#1B1E22; padding:20px 22px; display:flex; flex-direction:column; gap:6px;">
      <span class="mono" style="font-size:20px; letter-spacing:0.12em; color:#5A6068;">HEAT</span>
      <span class="disp" style="font-size:40px; color:#D63B3B;">4 / 5</span>
    </div>
    <div class="panel" style="background:#1B1E22; padding:20px 22px; display:flex; flex-direction:column; gap:6px;">
      <span class="mono" style="font-size:20px; letter-spacing:0.12em; color:#5A6068;">CONTRACTS LOST</span>
      <span class="disp" style="font-size:40px; color:#C9A227;">2</span>
    </div>
  </div>

  <!-- options -->
  <div style="position:absolute; left:32px; right:32px; top:1220px; z-index:35; display:flex; flex-direction:column; gap:16px;">
    <div class="sechead">
      <span class="mono" style="font-size:20px; letter-spacing:0.2em; color:#9AA0A6;">YOUR OPTIONS</span>
      <span class="rule"></span>
    </div>
    <button class="btn btn-secondary" style="justify-content:space-between; padding:0 28px; font-family:Inter, sans-serif; font-size:28px; text-transform:none; letter-spacing:0; min-height:96px;">
      <span>Post bail</span><span class="mono tab" style="font-size:22px; color:#57C785;">−£2,800 CLEAN</span>
    </button>
    <button id="brief" class="btn btn-secondary" style="justify-content:space-between; padding:0 28px; font-family:Inter, sans-serif; font-size:28px; text-transform:none; letter-spacing:0; min-height:96px;">
      <span>Call the brief</span><span class="mono" style="font-size:22px; color:#C9A227;">SILAS · OWES A FAVOUR</span>
    </button>
    <button class="btn btn-secondary" style="justify-content:space-between; padding:0 28px; font-family:Inter, sans-serif; font-size:28px; text-transform:none; letter-spacing:0; min-height:96px;">
      <span>Wait it out</span><span class="mono tab" style="font-size:22px; color:#9AA0A6;">11H · NO COST</span>
    </button>
    <button class="btn btn-danger" style="justify-content:space-between; padding:0 28px; font-family:Inter, sans-serif; font-size:28px; text-transform:none; letter-spacing:0; min-height:96px;">
      <span>Give them a name</span><span class="mono" style="font-size:22px;">OUT NOW · LEDGER ENTRY</span>
    </button>
  </div>

  <!-- brief pop-up -->
  <div id="pop" style="position:absolute; left:32px; right:32px; bottom:196px; z-index:45; display:none;">
    <div class="panel" style="border-left:6px solid #C9A227; background:#23262A; padding:22px 26px; display:flex; align-items:center; gap:20px;"></div>
  </div>

  <div id="nav"></div>
  <div class="grain"></div>
</div>

<script>
mountBackdrop({ lat:51.5975, lon:-0.1100, zoom:15.6,
  grade:'grayscale(1) brightness(0.26) contrast(1.55) saturate(0.7) blur(1px)' });
mountChrome('char', { heat:4, dirty:'£8,380', clean:'£3,050' });

// countdown — the pressure is the point
let left = 11 * 3600 + 2 * 60 + 39;
const clock = document.getElementById('clock');
setInterval(() => {
  left = Math.max(0, left - 1);
  const h = String(Math.floor(left / 3600)).padStart(2, '0');
  const m = String(Math.floor(left % 3600 / 60)).padStart(2, '0');
  const s = String(left % 60).padStart(2, '0');
  clock.textContent = h + ':' + m + ':' + s;
}, 1000);

const silas = CAST.find(c => c.id === 'silas');
document.getElementById('brief').addEventListener('click', () => {
  const pop = document.getElementById('pop');
  pop.style.display = 'block';
  pop.firstElementChild.innerHTML = `
    ${portraitSlot(silas, 96, '#C9A227')}
    <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:8px;">
      <span class="mono" style="font-size:20px; letter-spacing:0.14em; color:#C9A227;">${silas.name.toUpperCase()} · ${silas.role} · ANSWERED IN 4 RINGS</span>
      <span style="font-size:26px; line-height:1.35;">“${pick(silas.lines)}”</span>
    </div>
    <span class="mono" style="font-size:30px; color:#5A6068;">›</span>`;
});
</script>
</body>
</html>
