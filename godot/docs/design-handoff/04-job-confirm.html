<!DOCTYPE html>

<head>

<style>

<script>
const W = 1080, H = 1920;
function scaleFrame() {
  const f = document.getElementById('frame');
  const s = Math.min(1, window.innerHeight / H, window.innerWidth / W);
  f.style.transform = 'scale(' + s + ')';
  document.body.style.height = (H * s) + 'px';
}
window.addEventListener('resize', scaleFrame);
scaleFrame();

const map = L.map('leaf', {
  dragging:false, touchZoom:false, scrollWheelZoom:false, doubleClickZoom:false,
  boxZoom:false, keyboard:false, zoomControl:false, zoomSnap:0.1, attributionControl:true
});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap contributors', maxZoom:19
}).addTo(map);
map.setView([51.5395, -0.0565], 16.6);

// Scene text and the person warning you both re-roll — the cast is never the same twice.
const SCENES = [
  "Delivery lad idles outside ChickenLix with the engine running, phone wedged under his helmet. Two minutes of work if the road stays empty, and the road has been empty since the rain started at four.",
  "The bike's been on the same kerb since ten, indicator still blinking. Nobody's come out for it. Somebody will, eventually, and they'll shout, and shouting is the only real risk here.",
  "Two lads swapping bags outside the bookies, keys still in the ignition. Nine seconds of nerve, a wet corner at the lights, and it's yours before either of them turns round."
];

function reroll() {
  document.getElementById('scene').textContent = pick(SCENES);
  const c = pick(CAST);
  const tint = c.id === 'hallow' ? '#2E5EAA' : c.role === 'THE BRIEF' ? '#C9A227' : '#FFA94D';
  const adv = document.getElementById('advice');
  adv.style.borderLeftColor = tint;
  adv.innerHTML = `
    ${portraitSlot(c, 96, tint)}
    <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:8px;">
      <span class="mono" style="font-size:19px; letter-spacing:0.14em; color:${tint};">${c.name.toUpperCase()} · ${c.role} · ${c.place.toUpperCase()}</span>
      <span style="font-size:27px; line-height:1.35;">“${pick(c.lines)}”</span>
    </div>`;
}
document.getElementById('shuffle').addEventListener('click', reroll);
reroll();
</script>
