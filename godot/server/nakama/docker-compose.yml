# Nakama + Postgres for Postcode Wars — INERT until M3.
# The Godot LocalGateway runs the whole game with zero infrastructure today.
# When you're ready for accounts/leaderboards/wars, install Docker Desktop and:
#   cd godot/server/nakama && docker compose up
# Then implement NakamaGateway (same interface as LocalGateway) in the client.

version: "3"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdev
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 5s
      timeout: 3s
      retries: 5

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.24.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdev@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml
        --database.address postgres:localdev@postgres:5432/nakama
    volumes:
      - ./:/nakama/data
    ports:
      - "7350:7350"   # client API
      - "7351:7351"   # admin console
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
