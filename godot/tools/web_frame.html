<!-- Injected into the exported web index.html <head> so the portrait canvas
     sits on a designed backdrop on wide (PC) screens instead of black bars. -->
<style>
  :root { --pw-sodium:#FFA94D; --pw-bg:#07080A; }
  html, body {
    margin:0; height:100%; background:var(--pw-bg);
    /* wet-night wall: cool radial + faint sodium pool + grain-ish gradient */
    background-image:
      radial-gradient(120% 80% at 50% -10%, #14181f 0%, #0b0d10 45%, #07080A 100%),
      radial-gradient(40% 30% at 50% 92%, rgba(255,169,77,0.10), rgba(255,169,77,0) 70%);
    overflow:hidden;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
  }
  /* centre the game canvas and give it a device-like frame + glow */
  #canvas {
    display:block; margin:0 auto;
    height:100dvh; width:auto; max-width:100vw;
    aspect-ratio:1080 / 1920;
    box-shadow: 0 0 0 1px #2A2E33, 0 30px 120px rgba(0,0,0,0.8),
                0 0 140px rgba(255,169,77,0.06);
    border-radius:6px;
    outline:none;
    image-rendering:pixelated;
  }
  /* wordmark + hint shown only when there's room beside the portrait canvas */
  #pw-side { position:fixed; inset:0; pointer-events:none; z-index:-1;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 5vw; color:#3A4048; }
  #pw-side .wm { font-family:Anton, Impact, sans-serif; text-transform:uppercase;
    font-size:min(6vw,110px); line-height:0.9; letter-spacing:0.02em;
    color:#12151a; text-shadow:0 2px 40px #000; max-width:26vw; }
  #pw-side .hint { font-size:14px; letter-spacing:0.18em; color:#2A2E33; writing-mode:vertical-rl; }
  @media (max-aspect-ratio: 3/4) { #pw-side { display:none; } #canvas { width:100vw; height:auto; } }

  /* ---- branded download splash: restyle Godot's #status boot screen ---- */
  #status {
    position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:0;
    background:
      radial-gradient(64% 40% at 50% 34%, #16110a 0%, #0a0b10 52%, #05060a 100%) !important;
  }
  #status-splash { display:none !important; }            /* hide the Godot logo */
  #pw-mark {
    width:132px; height:132px; border-radius:24px; display:flex; align-items:center;
    justify-content:center; background:linear-gradient(180deg,#1b1f26,#0c0f14);
    border:1px solid rgba(255,169,77,.42);
    box-shadow:0 0 60px rgba(255,169,77,.20) inset, 0 0 60px rgba(255,169,77,.16);
    font-family:Anton, Impact, sans-serif; font-size:66px; color:#FFC97A;
    text-shadow:0 0 26px rgba(255,169,77,.7); animation:pwPulse 2.4s ease-in-out infinite; }
  @keyframes pwPulse { 0%,100% { transform:scale(1); opacity:.92 } 50% { transform:scale(1.05); opacity:1 } }
  #pw-word { margin-top:34px; font-family:Anton, Impact, sans-serif; text-transform:uppercase;
    font-size:44px; letter-spacing:0.01em; color:#EDEFF2; }
  #pw-sub  { margin-top:12px; font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:15px; letter-spacing:0.28em; color:#5A6068; }
  #status-progress, progress {
    -webkit-appearance:none; appearance:none; width:min(440px,72vw); height:14px;
    margin-top:40px; border:none; border-radius:5px; overflow:hidden;
    background:#161a20 !important; }
  #status-progress::-webkit-progress-bar { background:#161a20; border-radius:5px; }
  #status-progress::-webkit-progress-value {
    background:linear-gradient(180deg,#FFC97A,#FFA94D); border-radius:5px;
    box-shadow:0 0 12px rgba(255,169,77,.6); }
  #status-progress::-moz-progress-bar {
    background:linear-gradient(180deg,#FFC97A,#FFA94D); border-radius:5px; }
  #status-notice {
    margin-top:22px; background:transparent !important; border:none !important;
    color:#9AA0A6 !important; font-family:'IBM Plex Mono', ui-monospace, monospace !important;
    font-size:15px !important; letter-spacing:0.12em; max-width:80vw; text-align:center; }
</style>
<script>
  // brand the download splash: drop the PW mark + wordmark into Godot's #status,
  // above its progress bar. These live inside #status, so they vanish with it the
  // moment the engine hands over to the game's own loader.
  function pwBrandBoot() {
    var st = document.getElementById('status');
    var prog = document.getElementById('status-progress');
    if (!st || !prog || document.getElementById('pw-mark')) return;
    var mark = document.createElement('div'); mark.id = 'pw-mark'; mark.textContent = 'PW';
    var word = document.createElement('div'); word.id = 'pw-word'; word.textContent = 'POSTCODE WARS';
    var sub = document.createElement('div'); sub.id = 'pw-sub'; sub.textContent = 'LOADING THE MANOR';
    st.insertBefore(sub, prog); st.insertBefore(word, sub); st.insertBefore(mark, word);
  }
  document.addEventListener('DOMContentLoaded', pwBrandBoot);
  pwBrandBoot();

  window.addEventListener('load', function () {
    var s = document.createElement('div'); s.id = 'pw-side';
    s.innerHTML = '<div class="wm">POSTCODE<br>WARS</div>' +
      '<div class="hint">FROM WASTEMAN TO TOP BOY</div>';
    document.body.appendChild(s);
  });
</script>
